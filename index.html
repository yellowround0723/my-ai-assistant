<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 AI 비서</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f3f5f9;
  margin: 0;
  padding: 20px;
}
.container {
  max-width: 650px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 4px 20px #0001;
}
h1 { color: #263b63; }
.chat {
  min-height: 200px;
  background: #f5f7fb;
  padding: 15px;
  border-radius: 12px;
  margin: 20px 0;
}
input {
  width: 70%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
}
button {
  padding: 12px;
  background: #263b63;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
.message { margin: 12px 0; }
</style>
</head>
<body>
<div class="container">
  <h1>🤖 나의 AI 비서</h1>
  <p>안녕하세요! 무엇을 도와드릴까요?</p>

  <div class="chat" id="chat">
    <div class="message">
      <strong>비서:</strong> 반갑습니다!
      오늘은 어떤 일을 도와드릴까요?
    </div>
  </div>

  <input id="message" placeholder="메시지를 입력하세요">
  <button onclick="sendMessage()">보내기</button>
</div>

<script>
function sendMessage() {
  const input = document.getElementById("message");
  const chat = document.getElementById("chat");
  const message = input.value.trim();

  if (!message) return;

  const user = document.createElement("div");
  user.className = "message";
  user.textContent = "나: " + message;
  chat.appendChild(user);

  const reply = document.createElement("div");
  reply.className = "message";
  reply.textContent =
    "비서: 메시지를 받았습니다. AI 연결은 준비 중입니다.";
  chat.appendChild(reply);

  input.value = "";
}
</script>
</body>
</html>
